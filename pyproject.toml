[project]
name = "browser-use-benchmark"
version = "0.1.0"
description = "Open source benchmark for browser-use"
requires-python = ">=3.11"
dependencies = [
    "browser-use==0.11.5",
    "certifi",
    "cryptography",
    "httpx",
    "openpyxl>=3.1.5,<4",
    "pillow>=12.1.0",
    "python-dotenv",
    "websockets>=15,<17",
]

[project.optional-dependencies]
laminar = ["lmnr==0.7.56"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.12,<1"]
plots = ["matplotlib", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["."]
